<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Code Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="noise"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-bug-slash"></i>
                <h1>Error Code Explorer</h1>
            </div>
            <p class="subtitle">Vyhledej řešení pro svůj problémový kód</p>

            <div class="search-wrapper">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Zadejte error kód / Enter error code...">
                    <button id="clearSearch" class="hidden"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="lang-switcher">
                <i class="fa-solid fa-globe"></i>
                <select id="langSelect">
                    <option value="cs">Čeština</option>
                    <option value="en">English</option>
                    <option value="zh">中文 (Chinese)</option>
                </select>
            </div>

            <div class="tabs">
                <button class="tab active" data-type="all">Vše</button>
                <button class="tab" data-type="hardware">Hardware</button>
                <button class="tab" data-type="software">Software</button>
            </div>

            <div class="sub-tabs hidden" id="hwSubTabs">
                <button class="sub-tab active" data-sub="all">Všechny</button>
                <button class="sub-tab" data-sub="gpu">Grafická karta</button>
                <button class="sub-tab" data-sub="cpu">Procesor</button>
                <button class="sub-tab" data-sub="mb">Základní deska</button>
                <button class="sub-tab" data-sub="ram">RAM</button>
                <button class="sub-tab" data-sub="disk">Disk</button>
            </div>

            <div class="sub-tabs sw-sub-tabs hidden" id="swSubTabs">
                <button class="sub-tab sw active" data-swsub="all">Vše</button>
                <button class="sub-tab sw" data-swsub="windows">Windows</button>
                <button class="sub-tab sw" data-swsub="bios">BIOS / UEFI</button>
                <button class="sub-tab sw" data-swsub="network">Síť</button>
                <button class="sub-tab sw" data-swsub="apps">Aplikace &amp; Hry</button>
                <button class="sub-tab sw" data-swsub="drivers">Ovladače</button>
            </div>

            <!-- Vendor / Type Sub-Sub-Tabs (dynamically shown) -->
            <div class="vendor-tabs hidden" id="vendorTabs">
                <!-- populated by JS -->
            </div>
        </header>

        <main id="results">
            <!-- Karty budou vygenerovány pomocí JS -->
        </main>

        <div id="noResults" class="hidden no-results">
            <i class="fa-solid fa-ghost"></i>
            <h2>Nenalezen žádný kód</h2>
            <p>Zkuste upravit hledaný výraz. Hledali jste příliš specificky?</p>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-header">
                <span class="badge" id="modalBadge"></span>
                <span class="category" id="modalCategory"></span>
            </div>
            <h2 id="modalTitle" class="modal-title"></h2>
            <div class="modal-body">
                <div class="modal-section line-clamp">
                    <h3><i class="fa-solid fa-circle-info"></i> <span id="modalDescTitle">Obecný Popis</span></h3>
                    <p id="modalDesc"></p>
                </div>
                <div class="modal-section">
                    <h3><i class="fa-solid fa-wrench"></i> <span id="modalSolTitle">Řešení</span></h3>
                    <p id="modalSolution"></p>
                </div>
                <div class="modal-section advanced">
                    <h3><i class="fa-solid fa-microscope"></i> <span id="modalAdvTitle">Technické Detaily (Deep
                            Dive)</span></h3>
                    <p id="modalDetails"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
