<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Náhled — slovní ruleta v hero</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #12100D;
      --accent: #F5A524;
      --accent-light: #FFCB6B;
      --accent-dark: #3D2800;
      --text-primary: #F5F3EF;
      --text-secondary: #A39B8C;
      --border: rgba(255, 255, 255, .10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 5rem 2rem;
      width: 100%
    }

    h1 {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 4.6vw, 3.4rem);
      line-height: 1.18;
      letter-spacing: -.035em;
      margin-bottom: 1.5rem
    }

    .accent-text {
      color: var(--accent)
    }

    .hero-subtitle {
      color: var(--text-secondary);
      max-width: 54ch;
      margin-bottom: 2.25rem
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: .9rem
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-weight: 600;
      padding: .95rem 1.7rem;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background .18s ease, transform .18s ease, border-color .18s ease
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-dark)
    }

    .btn-primary:hover {
      background: var(--accent-light);
      transform: translateY(-2px)
    }

    .btn-secondary {
      background: rgba(255, 255, 255, .03);
      color: var(--text-primary);
      border-color: var(--border)
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, .07);
      border-color: rgba(255, 255, 255, .24)
    }

    /* =============================================
   SLOVNÍ RULETA V HERO NADPISU
   „Moje weby jsou vždycky [responzivní / rychlé / unikátní]"

   Slova sedí na plášti 3D válce (6 pozic po 60°, tři slova dvakrát).
   Slovo stojí --wr-hold vepředu, pak se válec za --wr-move pootočí.
   Záporné úhly = text přijíždí shora a odjíždí dolů.
   ============================================= */

    :root {
      --wr-line: 1.25em;
      /* výška jednoho řádku rulety */
      --wr-radius: 1.08em;
      /* poloměr válce = (wr-line / 2) / tan(30°) */
      --wr-bleed: 0.5em;
      /* rezerva proti oříznutí perspektivou */
      --wr-hold: 3s;
      /* jak dlouho slovo stojí */
      --wr-move: 0.55s;
      /* jak dlouho trvá otočení */
    }

    .word-roulette {
      position: relative;
      display: inline-block;
      vertical-align: baseline;
      height: var(--wr-line);
      perspective: 900px;

      /* rezerva po stranách: perspektiva přední slovo mírně zvětší */
      padding: 0 var(--wr-bleed);
      margin: 0 calc(var(--wr-bleed) * -1);

      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
      mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* neviditelné nejdelší slovo drží šířku, aby nadpis neposkakoval */
    .word-roulette__sizer {
      visibility: hidden;
      display: block;
    }

    .word-roulette__drum {
      position: absolute;
      top: 0;
      left: var(--wr-bleed);
      right: var(--wr-bleed);
      height: var(--wr-line);
      transform-style: preserve-3d;
      animation: wordDrumSpin calc((var(--wr-hold) + var(--wr-move)) * 6) infinite;
      animation-timing-function: cubic-bezier(.65, 0, .35, 1);
    }

    @keyframes wordDrumSpin {

      0%,
      14.085% {
        transform: rotateX(0deg)
      }

      16.667%,
      30.752% {
        transform: rotateX(-60deg)
      }

      33.333%,
      47.418% {
        transform: rotateX(-120deg)
      }

      50%,
      64.085% {
        transform: rotateX(-180deg)
      }

      66.667%,
      80.752% {
        transform: rotateX(-240deg)
      }

      83.333%,
      97.418% {
        transform: rotateX(-300deg)
      }

      100% {
        transform: rotateX(-360deg)
      }
    }

    .word-roulette__word {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--wr-line);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      white-space: nowrap;
      backface-visibility: hidden;
    }

    /* rozmístění po plášti válce — 360° / 6 pozic = 60° */
    .word-roulette__word:nth-child(1) {
      transform: rotateX(0deg) translateZ(var(--wr-radius))
    }

    .word-roulette__word:nth-child(2) {
      transform: rotateX(60deg) translateZ(var(--wr-radius))
    }

    .word-roulette__word:nth-child(3) {
      transform: rotateX(120deg) translateZ(var(--wr-radius))
    }

    .word-roulette__word:nth-child(4) {
      transform: rotateX(180deg) translateZ(var(--wr-radius))
    }

    .word-roulette__word:nth-child(5) {
      transform: rotateX(240deg) translateZ(var(--wr-radius))
    }

    .word-roulette__word:nth-child(6) {
      transform: rotateX(300deg) translateZ(var(--wr-radius))
    }

    /* text jen pro čtečky obrazovky */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .word-roulette {
        perspective: none;
        -webkit-mask-image: none;
        mask-image: none;
        padding: 0;
        margin: 0;
      }

      .word-roulette__drum {
        animation: none;
        transform: none;
        left: 0;
        right: 0;
      }

      .word-roulette__word {
        transform: none !important;
      }

      .word-roulette__word:not(:first-child) {
        display: none;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <h1>Stavím weby ručně po řádku.<br>
      <span class="accent-text">Moje weby jsou vždycky
        <span class="word-roulette">
          <span class="word-roulette__sizer" aria-hidden="true">responzivní</span>
          <span class="visually-hidden">responzivní, rychlé a unikátní.</span>
          <span class="word-roulette__drum" aria-hidden="true">
            <span class="word-roulette__word">responzivní.</span>
            <span class="word-roulette__word">rychlé.</span>
            <span class="word-roulette__word">unikátní.</span>
          </span>
        </span>
      </span>
    </h1>
    <p class="hero-subtitle">Je mi 17 let, studuji VOŠ ve Varnsdorfu a píšu HTML/CSS/JS kód. Na webech mě nejvíce baví
      přemýšlet, jak udělat atraktivní design.</p>
    <div class="hero-buttons">
      <a href="#" class="btn-primary">Zobrazit ceník →</a>
      <a href="#" class="btn-secondary">Napsat zprávu</a>
    </div>
  </section>
</body>

</html>
